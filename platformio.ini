[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600  ; Faster upload

; ========== MEMORY ==========
; NOTE: not every board variant actually has PSRAM populated - the code
; (e.g. the QR canvas allocation in src/main.cpp) checks ESP.getPsramSize()
; and falls back to internal RAM if it's 0, so this is safe to leave
; enabled either way.
board_build.psram = enabled        ; Enable PSRAM (if present - see note above)
board_build.flash_mode = qio       ; Quad I/O (faster than DIO)
board_build.partitions = partitions.csv  ; 16MB partition table

; ========== LIBRARIES ==========
lib_deps =
    lvgl/lvgl@^8.3.11
    arduino-libraries/NTPClient@^3.2.1
    bblanchon/ArduinoJson@^6.21.3  ; Used by the WiFi portal

    ; Do not use AsyncWebServer - conflicts with the synchronous WebServer
    ; used by the WiFi portal (wifi_portal.cpp)
    ; me-no-dev/ESPAsyncWebServer

; ========== BUILD FLAGS ==========
build_flags =
    ; USB CDC
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

    ; LVGL config
    -DLV_CONF_INCLUDE_SIMPLE=1
    -DLV_MEM_SIZE=65536             ; LVGL's own heap - independent of the display draw buffers (see DRAWBUF_LINES in src/main.cpp)
    -DLV_COLOR_DEPTH=16             ; RGB565
    -DLV_COLOR_16_SWAP=1            ; Byte swap for the LCD
    -DLV_USE_LOG=0                  ; Disable LVGL's own logging
    -DLV_USE_ASSERT_NULL=0
    -DLV_USE_PERF_MONITOR=0

    ; PSRAM
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_USE_MALLOC=1
    -DCONFIG_SPIRAM_USE_CAPS_ALLOC=1
    -mfix-esp32-psram-cache-issue   ; Original-ESP32 PSRAM cache erratum workaround - not applicable to ESP32-S3, harmless no-op here

    ; ESP32-S3 specific
    -DCORE_DEBUG_LEVEL=0
    -DESP32_S3=1

    ; Compiler optimizations
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections               ; Link-time garbage collection
    -Wno-psabi                      ; Silence ABI warnings

    ; Include paths
    -Iinclude
    -Isrc
    -Llib

; ========== LINKER OPTIONS ==========
build_unflags = -Wl,-u  ; Remove default linker flags

; ========== OPTIMIZATIONS ==========
board_build.f_cpu = 240000000L     ; 240MHz (max for ESP32-S3)
board_build.f_flash = 80000000L    ; 80MHz flash (faster)
build_type = release               ; Release mode (smaller, faster)

; ========== IGNORE PROBLEMATIC LIBRARIES ==========
lib_ignore =
    ESPAsyncTCP
    ESPAsyncWebServer
    AsyncTCP
    AsyncTCP_RP2040W

; ========== EXTRA OPTIONS ==========
upload_port = /dev/cu.usbmodem*    ; macOS auto-detect pattern - adjust for your OS (e.g. COM3 on Windows, /dev/ttyUSB0 on Linux)
monitor_filters = esp32_exception_decoder  ; Decodes crash backtraces in the serial monitor
